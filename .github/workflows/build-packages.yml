name: Build-luci-app-timecontrol

on:
  push:
    paths:
      - 'luci-app-timecontrol/**'
      - 'Makefile'
      - 'src/**'
      - 'luasrc/**'
      - 'htdocs/**'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
        sdk:
          - openwrt-23.05     # 编译出 IPK (适用 21.02 ~ 23.05)
          - openwrt-24.10     # 编译出 IPK (适用 24.10 早期过渡)
          - master            # 编译出 APK (适用 OpenWrt SNAPSHOT / 24.10+ 新架构)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set current date
        id: date
        run: echo "date=$(date +'\%Y-\%m-\%d')" >> $GITHUB_OUTPUT

      - name: Get all commit messages
        id: get_commits
        run: |
          set -eu

          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=format:'%s' ${{ github.event.before }}..${{ github.sha }} > commits.txt || true
          else
            git log -1 --pretty=format:'%s' > commits.txt || true
          fi

          if [ -f commits.txt ] && [ -s commits.txt ]; then
            printf '\n' >> commits.txt
          fi

          if [ -f commits.txt ]; then
            awk 'NF { print "- " $0 }' commits.txt > commits_md.txt || true
          fi

          DELIM="END_OF_COMMIT_MSGS_$(date +%s%N)"
          printf 'commit_msgs<<%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
          cat commits_md.txt >> "$GITHUB_OUTPUT" || true
          printf '%s\n' "$DELIM" >> "$GITHUB_OUTPUT"

          echo "Found commits:"
          if [ -s commits.txt ]; then
            cat commits.txt
          else
            echo "(no commits found)"
          fi

      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-timecontrol
          NO_REFRESH_CHECK: true
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/

      - name: Create compress files
        run: |
          zip -j Luci-app-timecontrol-${{ matrix.sdk }}.zip bin/packages/${{ matrix.arch }}/packages_ci/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.date.outputs.date }}
          files: Luci-app-timecontrol-${{ matrix.sdk }}.zip
          body: |
            ### 更新日志：
            
            ${{ steps.get_commits.outputs.commit_msgs }}

            #### 安装说明与格式区分：
            
            - **`*-openwrt-23.05.zip / *-openwrt-24.10.zip`** --> **`.ipk` 安装包**
              安装命令：`opkg install luci-app-timecontrol*.ipk`
            
            - **`*-master.zip`** --> **`.apk` 安装包**
              跳过证书安装命令：`apk add --allow-untrusted luci-app-timecontrol*.apk`
